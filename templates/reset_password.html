<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Reset password · Chat IPA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#171717;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(440px,100%);padding:30px 26px;border:1px solid #3d3d3d;border-radius:22px;background:#212121;box-shadow:0 24px 90px #0008}
    .mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#10a37f,#4d9bff);font-size:1.35rem;font-weight:800;margin-bottom:18px}
    h1{font-size:1.55rem;letter-spacing:-.04em;margin:0 0 8px}p{color:#aaa;font-size:.92rem;margin:0 0 20px}
    label{display:block;font-size:.88rem;margin:15px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #4a4a4a;border-radius:11px;background:#171717;color:#fff;font:inherit}
    input:focus{outline:2px solid #10a37f;outline-offset:1px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#f5f5f5;color:#171717;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #message{min-height:1.5em;margin:14px 0;color:#baf3df;font-size:.88rem}#message.error{color:#ffb4b4}a{color:#baf3df;text-decoration:none}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">C</div>
  <h1 id="title">Reset your password</h1>
  <p id="intro">Enter your account email and we’ll send a secure, one-time reset link if the account exists.</p>
  <form id="requestForm">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
    <button id="requestButton" type="submit">Send reset link</button>
  </form>
  <form id="confirmForm" hidden>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="256" required placeholder="At least 10 characters">
    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="256" required placeholder="Enter it again">
    <button id="confirmButton" type="submit">Update password</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
  <a href="/">← Back to Chat IPA</a>
</main>
<script>
  const params=new URLSearchParams(location.search);
  const token=params.get('token')||'';
  const requestForm=document.getElementById('requestForm');
  const confirmForm=document.getElementById('confirmForm');
  const message=document.getElementById('message');
  const say=(text,error=false)=>{message.textContent=text;message.classList.toggle('error',error)};
  if(token){
    requestForm.hidden=true;
    confirmForm.hidden=false;
    document.getElementById('title').textContent='Choose a new password';
    document.getElementById('intro').textContent='Use a password with at least 10 characters. Reset links expire after 30 minutes and work only once.';
  }
  requestForm.addEventListener('submit',async event=>{
    event.preventDefault();const button=document.getElementById('requestButton');button.disabled=true;say('Sending request…');
    try{
      const response=await fetch('/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});
      const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not request a reset.');
      say(data.message||'If an account exists for that email, a reset link will be sent.');
    }catch(error){say(error.message||'Could not request a reset. Please try again.',true)}
    finally{button.disabled=false}
  });
  confirmForm.addEventListener('submit',async event=>{
    event.preventDefault();
    const password=document.getElementById('password').value;
    if(password!==document.getElementById('confirmPassword').value){say('The passwords do not match.',true);return}
    const button=document.getElementById('confirmButton');button.disabled=true;say('Updating password…');
    try{
      const response=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
      const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not update password.');
      say('Password updated. Taking you back to login…');setTimeout(()=>location.assign('/?login=1'),900);
    }catch(error){say(error.message||'Could not update password. Request a fresh reset link.',true)}
    finally{button.disabled=false}
  });
</script>
</body>
</html>
