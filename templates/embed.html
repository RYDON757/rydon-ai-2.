<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Chat with RYDON AI</title>
  <style>
    :root{color-scheme:dark;--bg:#171717;--panel:#222;--line:#3b3b3b;--text:#f5f5f5;--muted:#aaa;--accent:#10a37f}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .widget{height:100dvh;min-height:300px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
    header{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:#1c1c1c}
    .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#10a37f,#4d9bff);display:grid;place-items:center;font-weight:800}
    .heading{font-weight:700}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;background:#10a37f;border-radius:50%;margin-right:5px}
    #messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
    .welcome{margin:auto;text-align:center;max-width:320px;color:var(--muted);padding:16px}
    .welcome strong{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
    .msg{max-width:92%;padding:11px 13px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-end;background:#303030}.assistant{align-self:flex-start;background:#242424;border:1px solid #333}
    .thinking{color:var(--muted);font-size:13px;padding:4px}
    form{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:#1c1c1c}
    textarea{flex:1;min-width:0;max-height:110px;resize:vertical;border:1px solid #444;border-radius:12px;background:#292929;color:var(--text);padding:11px;font:inherit;outline:none}
    textarea:focus{border-color:var(--accent)}button{border:0;border-radius:12px;padding:0 15px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    footer{text-align:center;color:#858585;font-size:11px;padding:0 8px 8px;background:#1c1c1c}footer a{color:#aaa}
    @media(max-width:420px){ #messages{padding:11px}.msg{max-width:97%}header{padding:10px 12px}form{padding:8px}}
  </style>
</head>
<body>
  <main class="widget" aria-label="RYDON AI chat widget">
    <header>
      <div class="logo" aria-hidden="true">R</div>
      <div><div class="heading">RYDON AI 2.0</div><div class="status"><span class="dot"></span>Your AI assistant</div></div>
    </header>
    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome"><strong>Hey there 👋</strong>Ask RYDON AI a question to get started.</div>
    </section>
    <form id="chat-form">
      <textarea id="prompt" rows="1" maxlength="4000" placeholder="Message RYDON AI..." aria-label="Your message" required></textarea>
      <button id="send" type="submit" aria-label="Send message">Send</button>
    </form>
    <footer>Powered by <a href="/" target="_blank" rel="noopener">RYDON AI 2.0</a></footer>
  </main>
  <script>
    (() => {
      const form = document.getElementById('chat-form');
      const input = document.getElementById('prompt');
      const send = document.getElementById('send');
      const messages = document.getElementById('messages');
      const history = [];
      let busy = false;
      function addMessage(role, text) {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();
        const node = document.createElement('div');
        node.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
        return node;
      }
      async function submitMessage() {
        const message = input.value.trim();
        if (!message || busy) return;
        busy = true; send.disabled = true; input.disabled = true;
        addMessage('user', message);
        input.value = '';
        const pending = addMessage('assistant', 'Thinking…');
        pending.classList.add('thinking');
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message, history: history.slice(-20)})
          });
          const data = await response.json();
          const reply = data.reply || data.error || 'I could not get a response. Please try again.';
          pending.textContent = reply;
          pending.classList.remove('thinking');
          history.push({role:'user', content:message}, {role:'assistant', content:reply});
          if (!response.ok) pending.textContent = reply;
        } catch (error) {
          pending.textContent = 'Connection problem. Please try again in a moment.';
          pending.classList.remove('thinking');
        } finally {
          busy = false; send.disabled = false; input.disabled = false; input.focus();
          messages.scrollTop = messages.scrollHeight;
        }
      }
      form.addEventListener('submit', event => { event.preventDefault(); submitMessage(); });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
      });
    })();
  </script>
</body>
</html>
